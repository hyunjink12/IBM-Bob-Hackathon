name: Frontend build

# Verifies the Vite frontend builds cleanly on supported Node versions before
# Vercel picks up the same commit. Path filter skips CI when only backend or
# docs change, so we don't burn Actions minutes on backend-only PRs.

on:
  push:
    branches: [ "main" ]
    paths:
      - "client-react-vite/**"
      - ".github/workflows/node.js.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "client-react-vite/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-react-vite

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client-react-vite/package-lock.json

      - run: npm ci

      - run: npm run build
