# One-command stack for local dev on Windows and Mac.
# From the repo root: docker compose up

services:
  backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: corn-ethanol-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend-python/.env
    environment:
      APP_ENV: development
      APP_DUCKDB_PATH: /app/data/ethanol_dashboard.duckdb
      APP_CRUSH_MODEL_PATH: /app/config/crush_model.json
      PYTHONUNBUFFERED: "1"
    volumes:
      # Bind-mount app code so uvicorn --reload picks up edits on both OSes.
      - ./backend-python/app:/app/app
      - ./config:/app/config:ro
      - ./backend-python/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
